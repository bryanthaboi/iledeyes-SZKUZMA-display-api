name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:    # also allow manual triggering from the Actions tab

permissions:
  contents: write       # needed to create releases + upload artifacts

concurrency:
  # Don't pile up parallel builds on the runner if you push twice quickly;
  # cancel the older one.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "runner:     $RUNNER_NAME"
          echo "workspace:  $GITHUB_WORKSPACE"
          sw_vers
          python3 --version
          which python3

      - name: Build artifacts
        run: ./build.sh

      - name: Build Stream Deck plugin
        run: ./streamdeck-plugin/build-plugin.sh

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # .app is a directory — ditto preserves codesign + xattrs and produces
          # a clean .zip that re-extracts as a proper launchable bundle.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/displayathon.app \
            artifacts/displayathon.app.zip

          # Single-file service binary
          cp dist/displayathon-service artifacts/displayathon-service
          chmod +x artifacts/displayathon-service

          # Stream Deck plugin bundle (double-click to install on macOS or Windows)
          cp streamdeck-plugin/dist/com.displayathon.controller.streamDeckPlugin \
             artifacts/com.displayathon.controller.streamDeckPlugin

          # Version = ISO date + short SHA so multiple commits in a day don't collide.
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "--- built artifacts ---"
          ls -lh artifacts/

      - name: Write release notes
        run: |
          set -euo pipefail
          {
            echo "Automated build from commit \`${GITHUB_SHA}\`."
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download the artifacts below."
            echo "2. Unzip \`displayathon.app.zip\` and drag the \`.app\` to \`/Applications\`."
            echo "   First launch: right-click → **Open** to get past Gatekeeper."
            echo "3. Drop \`displayathon-service\` into the repo dist/ folder and run"
            echo "   \`./service/install.sh\`, or put it directly at"
            echo "   \`~/Library/displayathon/bin/displayathon-service\` and register the launchd plist."
            echo "4. (Optional) Double-click \`com.displayathon.controller.streamDeckPlugin\`"
            echo "   to install the Stream Deck plugin. Configure its Base URL in any action's"
            echo "   Property Inspector — one global setting, shared by every key."
            echo ""
            echo "## Commit"
            echo '```'
            git log -1 --pretty=%B
            echo '```'
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.package.outputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            artifacts/displayathon.app.zip \
            artifacts/displayathon-service \
            artifacts/com.displayathon.controller.streamDeckPlugin
