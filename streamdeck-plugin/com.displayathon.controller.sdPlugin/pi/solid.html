<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head><body>
<div id="server"></div>

<h2>Solid</h2>
<div class="row">
  <label>Colour</label>
  <input type="color" id="hex">
  <span class="value" id="hexVal"></span>
</div>
<div class="hint">Posted to <code>/api/solid</code> with this color.</div>

<script src="common.js"></script>
<script>
document.getElementById('server').innerHTML = datPI.serverBlock();
datPI.onSettings = (s) => {
  datPI.wireServerBlock();
  if (!s.hex) s.hex = '#ffcc00';
  document.getElementById('hex').value = s.hex;
  document.getElementById('hexVal').textContent = s.hex.toUpperCase();
  datPI.bind('#hex', 'hex');
  document.getElementById('hex').addEventListener('input', (e) =>
    document.getElementById('hexVal').textContent = e.target.value.toUpperCase()
  );
};
</script>
</body></html>
